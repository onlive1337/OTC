services:
  otc-bot:
    build: .
    container_name: otc_telegram_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - LOG_CHAT_ID=${LOG_CHAT_ID}
      - COINGECKO_DEMO_API_KEY=${COINGECKO_DEMO_API_KEY:-}
      - COINCAP_API_KEY=${COINCAP_API_KEY:-}
      - POLLING_CONCURRENCY=${POLLING_CONCURRENCY:-100}
      - POLLING_SHUTDOWN_TIMEOUT=${POLLING_SHUTDOWN_TIMEOUT:-8}
      - SYNC_BOT_SETTINGS=${SYNC_BOT_SETTINGS:-true}
      - ENABLE_WIDGET_CALC=${ENABLE_WIDGET_CALC:-false}
      - INLINE_QUERY_PLACEHOLDER=${INLINE_QUERY_PLACEHOLDER:-100 USD, 50+50, 100 USD EUR}
      - CALLBACK_QUERY_MODE=${CALLBACK_QUERY_MODE:-default}
      - TZ=Europe/Moscow
      - DB_PATH=/app/data/otc.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  bot-network:
    driver: bridge
